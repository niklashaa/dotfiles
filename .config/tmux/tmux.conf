set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -g status-keys "emacs"
set-option -g mouse on
set-option -g focus-events on
set-option -g allow-passthrough on
# set-option -g mouse-select-window on
set-option -sg escape-time 10

# Set Ctrl+s to default prefix
unbind C-b
set-option -g prefix C-s
bind-key -r C-j send-prefix

######################
#### Key Bindings ####
######################

# Kill pane without confirmation
bind-key x kill-pane

# Reload config file
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# Split window and fix path for tmux 3.9
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g history-limit 50000

set-option -g status-bg '#666666'
set-option -g status-fg '#aaaaaa'

set-option -g status-left-length 50

set-option -g status-right " #(date '+%a, %b %d - %I:%M') "

# Pane borders
set -g pane-border-style 'fg=colour245'
set -g pane-active-border-style 'fg=green'
set -g pane-border-status off
set -g pane-border-format ''
set -g pane-border-indicators colour

# Keep manually set window names
set-option -g allow-rename off

# Paint a window yellow when Claude Code stops in it; unpaint on focus.
# The Stop hook in ~/.claude/settings.json runs:
#   tmux set-window-option window-status-style 'fg=colour232 bg=yellow bold'
set-hook -g pane-focus-in 'set-window-option -u window-status-style'

# Active window stands out in status bar
setw -g window-status-current-style 'fg=colour232 bg=green bold'
setw -g window-status-current-format ' #I:#W #{?#{@ccwork_panes},◉, } '
setw -g window-status-style 'fg=colour250'
setw -g window-status-format ' #I:#W #{?#{@ccwork_panes},◉, } '
setw -g window-status-separator ''

# Fine adjustment (1 or 2 cursor cells per bump)
bind-key -n S-Left resize-pane -L 2
bind-key -n S-Right resize-pane -R 2
bind-key -n S-Down resize-pane -D 1
bind-key -n S-Up resize-pane -U 1

# Coarse adjustment (5 or 10 cursor cells per bump)
bind-key -n C-Left resize-pane -L 10
bind-key -n C-Right resize-pane -R 10
bind-key -n C-Down resize-pane -D 5
bind-key -n C-Up resize-pane -U 5

# Swap window left/right
bind-key -r < swap-window -t -1\; select-window -t -1
bind-key -r > swap-window -t +1\; select-window -t +1

# Open new window in current path
bind-key c new-window -c "#{pane_current_path}"

# Create new named session
bind-key C command-prompt -p "session:" "new-session -s '%%'"

# Clear Claude Code working indicator on current window
bind-key O run-shell 'tmux set-window-option @ccwork_panes ""'

# Start window numbering at 1
set-option -g base-index 1
# Renumber windows as they are created and destroyed to keep the window numbers consistent with the count
set-option -g renumber-windows on

## Use vim keybindings in copy mode
setw -g mode-keys vi
set-option -s set-clipboard on
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter

# Clipboard: OSC 52 handles clipboard via set-clipboard on (works over SSH)
# On macOS, also pipe to pbcopy for non-terminal clipboard integration
if-shell "command -v pbcopy" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel; \
   bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel; \
   bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel"

# Move current pane to its own window
bind-key b break-pane -d

# Prompted join-pane
bind-key j command-prompt -p "join pane from: "  "join-pane -h -s '%%'"

# Switch sessions with sesh + fzf
bind-key C-j display-popup -E -w 80% -h 80% "sesh connect \"\$(
    sesh list -t --icons | fzf --reverse --ansi --no-sort --border \
        --prompt '🪟  ' --header '^t tmux ^a all ^g configs ^x zoxide ^d kill' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
        --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
        --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(🪟  )+reload(sesh list -t --icons)'
)\""

# Switch tmux windows with fzf
bind-key w display-popup -E -w 80% -h 80% "tmux list-windows -F '#{window_index}: #{window_name}' | fzf --reverse | cut -d: -f1 | xargs -r tmux select-window -t"

# Swap a pane (targeted by pane number) with the current pane
bind-key s display-panes\; command-prompt -p "pane #: "  "swap-pane -t '%%'"

# Kill session
bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
